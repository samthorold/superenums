# https://taskfile.dev
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  check:
    desc: Run everything (tests, type-level suite, strict checkers, lint)
    cmds:
      - uv run scripts/check.py

  test:
    desc: Run the runtime tests (including the doc examples)
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  typing:
    desc: Run the type-level suite (including type-checking the doc examples)
    cmds:
      - uv run python tests/typing/run.py

  example:
    desc: Run the bank tellers simulation (examples/bank_tellers.py, uses py-ev)
    cmds:
      - uv run examples/bank_tellers.py

  example-check:
    desc: Type-check the bank tellers example with pyright, mypy and ty
    vars:
      PY:
        sh: uv python find --script examples/bank_tellers.py
    cmds:
      - uv run pyright --pythonpath {{.PY}} -p examples
      - uv run mypy --strict --python-executable {{.PY}} --python-version 3.13 examples/bank_tellers.py
      - uv run ty check --python {{.PY}} --python-version 3.13 examples/bank_tellers.py

  lint:
    desc: Lint and check formatting
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  fmt:
    desc: Apply lint fixes and format
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  hooks:
    desc: Run every pre-commit hook on all files (what CI runs)
    cmds:
      - uv run pre-commit run --all-files

  version:
    desc: Print the current package version
    cmds:
      - uv version --short
    silent: true

  bump:
    desc: "Bump the version: task bump -- patch|minor|major"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Usage: task bump -- patch|minor|major"
    cmds:
      - uv version --bump {{.CLI_ARGS}}
