[project]
name = "superenums"
version = "0.4.0"
description = "Rust-style enums for Python: variants that carry data, and type-checker-proven exhaustive matching."
readme = "README.md"
authors = [
    { name = "Sam Thorold", email = "sam.thorold@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

# Serialization extensions: one module and one extra per library.
[project.optional-dependencies]
cattrs = ["cattrs>=24.1"]
pydantic = ["pydantic>=2.11"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# The one place uv's version is pinned: setup-uv reads it in CI, and uv refuses
# to run locally at any other version. Upgrade it together with the uv_build
# bound above.
[tool.uv]
required-version = "==0.13.1"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "cattrs==26.2.1",
    "msgspec==0.22.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pydantic==2.14.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
    "ty==0.0.89",
]

[tool.ruff]
target-version = "py312"
# The design docs keep their compact one-line examples. The user guide
# (docs/guide.md) is formatted like code, since its examples are run as tests.
extend-exclude = ["docs/system-design", "docs/prior-art.md", "CLAUDE.md"]
# Keep those exclusions when files are passed explicitly (as pre-commit does).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# Library source: strict. pyright's config is pyrightconfig.json (a pyproject
# section loses to any pyrightconfig.json in a parent directory). The type-level
# suite has its own configs in tests/typing/.
[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
